on:
  workflow_dispatch:
  schedule:
    # At 20 seconds past the minute, every 12 hours, starting at 06:00 AM
    - cron: '20 * 6/12 * * *'
name: Excavator
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
